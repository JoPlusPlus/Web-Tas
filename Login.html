<!DOCTYPE html>
<html>
    <head>
        <title>Login</title>
        <link rel="stylesheet" href="login.css">
        
    </head>
    <body>
        <nav>
            <div class="siteName">Reading With Us</div>
        </nav>
        <form>
            <div class="signupContainer">
                <h2>Log in</h2>
                <label for="email">Email</label><br>
                <input type="email" id="email" class="form" required><br>

                <label for="pass">Password</label><br>
                <input type="password" id="pass" class="form" required><br>

                <input type="submit" value="Submit" id="Submit" onclick="login(event)">

                <div id="login-div">
                    <p>Don't have an account?</p>
                    <a href="signup.html" id="login" target="_blank">SignUp</a>
                </div>
            </div>
        </form>
        <script src="login.js"></script>
        
        
    </body>
</html>
